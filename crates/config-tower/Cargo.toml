[package]
name = "config-tower"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "sumo-cfg"
path = "src/main.rs"

[dependencies]
wire = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
jsonschema = { workspace = true }

[dev-dependencies]
# The router is tested by CALLING it — `oneshot` against the same `Router` the
# binary serves, over the tower's own Postgres. `sha2` hashes the served blob
# independently of the tower's own hashing.
tower = { version = "0.5", features = ["util"] }
sha2 = { workspace = true }
